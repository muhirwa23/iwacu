<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eHanga - Online Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css'>
</head>
<body>
    <!--header-->
    <header>
        <!--nav-->
        <div class="nav container">
            <a href="#" class="logo">eHanga</a>
            <!--cart icon-->
            <i class='bx bx-shopping-bag' id="cart-icon"></i>
            <!--cart-->
            <div class="cart">
                <h2 class="cart-title">Your Cart</h2>   
                <!--content-->
                <div class="cart-content">
                    <!-- Cart items will be added here dynamically -->
                </div>
                <!--total-->
                <div class="total">
                    <div class="total-title">Total</div>
                    <div class="total-price">$0</div>
                </div>
                <!--buy button-->
                <button type="button" class="btn-buy">Buy Now</button>
                <!--cart close-->
                <i class='bx bx-x' id="close-cart"></i>
            </div>
        </div>
    </header>

    <section class="shop container">
        <h2 class="section-title">Shop Products</h2>
        <!--content-->
        <div class="shop-content">
            <!--box 1-->
            <div class="product-box">
                <img src="img/a1.jpg" alt="" class="product-img">
                <h2 class="product-title">Swatx</h2>
                <span class="price">$12</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--box 2-->
            <div class="product-box">
                <img src="img/a4.jpg" alt="" class="product-img">
                <h2 class="product-title">Paritno</h2>
                <span class="price">$20</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--box 3-->
            <div class="product-box">
                <img src="img/a5.jpg" alt="" class="product-img">
                <h2 class="product-title">Gibusat</h2>
                <span class="price">$40</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--box 4-->
            <div class="product-box">
                <img src="img/a6.jpg" alt="" class="product-img">
                <h2 class="product-title">Gibxt</h2>
                <span class="price">$12</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--box 5-->
            <div class="product-box">
                <img src="img/a8.jpg" alt="" class="product-img">
                <h2 class="product-title">Kotier</h2>
                <span class="price">$15</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--box 6-->
            <div class="product-box">
                <img src="img/b2.jpg" alt="" class="product-img">
                <h2 class="product-title">Bag</h2>
                <span class="price">$12</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--box 7-->
            <div class="product-box">
                <img src="img/b8.jpg" alt="" class="product-img">
                <h2 class="product-title">Chip</h2>
                <span class="price">$71</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!--box 8-->
            <div class="product-box">
                <img src="img/b10.jpg" alt="" class="product-img">
                <h2 class="product-title">Houstyo</h2>
                <span class="price">$19</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
        </div>
    </section>
    <!--footer-->
    <section class="footer">
        <div class="container">
            <div class="row text-center">
                <p>© eHanga 2023</p>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
